name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read   # the previous build's manifest, for the update package
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2, updated: downloading the installer
          # failed with HTTP 504 in three runs on 2026-11-09.
          release: false
          update: true
          install: git make diffutils
          # mpv is built by packaging/windows/build-mpv.sh (playback only);
          # these are its dependencies.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p meson:p nasm:p
            qt6-base:p qt6-declarative:p qt6-tools:p
            libtorrent-rasterbar:p sqlite3:p mesa:p
            dav1d:p libass:p lcms2:p uchardet:p zimg:p libdovi:p libiconv:p

      - name: Cache the mpv build
        uses: actions/cache@v4
        with:
          path: .deps
          key: mpv-${{ runner.os }}-${{ hashFiles('packaging/windows/build-mpv.sh') }}

      - name: Build FFmpeg, libplacebo and mpv (playback only)
        timeout-minutes: 40
        run: packaging/windows/build-mpv.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps"

      - name: Configure
        run: |
          DEPS="$(cygpath -u "$GITHUB_WORKSPACE")/.deps"
          export PATH="$DEPS/bin:$PATH" PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(cygpath -m "$DEPS")"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          ctest --test-dir build -LE bench --output-on-failure

      # The console output of a hung test is lost on Windows; the logs keep it.
      - name: Test logs
        if: failure()
        run: for f in build/tests/*.log; do echo "== $f"; tail -n 400 "$f"; done

      # A crash inside libtorrent shows only "SegFault"; run the broker test
      # under gdb for a stack trace.
      - name: Crash trace
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gdb >/dev/null
          # gdb stops at every access violation, including any libtorrent
          # handles itself. Continue past them and show the last stop.
          { echo "set pagination off"; echo run
            for i in $(seq 200); do printf '%s\n' bt 'info symbol $pc' 'x/6i $pc-12' continue; done
            echo "info sharedlibrary"; } > gdb.cmd
          gdb -batch -x gdb.cmd --args build/tests/tst_broker.exe > gdb.txt 2>&1 || true
          grep -c "received signal" gdb.txt || true
          grep -E "received signal|exited" gdb.txt | tail -3
          awk '/received signal/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' gdb.txt | head -60
          grep -i "libtorrent" gdb.txt | grep -i "0x" | head -3

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          ctest --test-dir build -L bench -V

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          ./build/src/app/CorporalJackie.exe --smoke-test

      # The shipped folder: the small launcher and the license at the top, and
      # the real app with all its DLLs, plugins and QML in app\.
      - name: Package
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          rm -rf dist && mkdir -p dist/app
          cp build/src/app/CorporalJackie.exe dist/app/
          WDQ=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)
          "$WDQ" --release --qmldir src/ui --no-translations \
            --skip-plugin-types qmltooling,generic,networkinformation dist/app/CorporalJackie.exe
          # The app uses the Basic control style only. windeployqt copies every
          # style Qt ships (Material, Fluent, Imagine...), about 30 MB never loaded.
          for style in Material Universal Imagine Fusion FluentWinUI3 Windows; do
            rm -rf "dist/app/qml/QtQuick/Controls/$style"
            rm -f dist/app/Qt6QuickControls2${style}.dll dist/app/Qt6QuickControls2${style}StyleImpl.dll
          done
          rm -rf dist/app/qml/QtQuick/NativeStyle dist/app/Qt6QuickNativeStyle.dll
          # Copy every DLL the app and its Qt plugins need: our mpv build, and
          # MSYS2's Qt, libtorrent and the rest.
          for f in dist/app/CorporalJackie.exe $(find dist/app -name '*.dll'); do
            ldd "$f" | awk '/\/ucrt64\/|\/\.deps\// {print $3}'
          done | sort -u | xargs -r -I{} cp -n {} dist/app/
          # Point Qt at the bundled plugins and QML modules instead of /ucrt64.
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' > dist/app/qt.conf
          cp build/launcher/CorporalJackie.exe dist/
          # The launcher must not need any DLL that is not part of Windows.
          if ldd dist/CorporalJackie.exe | grep -i ucrt64; then echo "launcher depends on MSYS2 DLLs"; exit 1; fi
          cp LICENSE dist/LICENSE.txt
          # The updater ships with the app, so an update package carries only
          # data: the checks it must pass come from the installed copy.
          mkdir -p dist/app/updater
          cp packaging/windows/updater/apply-update.ps1 dist/app/updater/
          cp "packaging/windows/updater/Update Corporal Jackie.cmd" dist/
          if [ -f packaging/windows/update-key.xml ]; then cp packaging/windows/update-key.xml dist/app/updater/
          else echo "No packaging/windows/update-key.xml: this build will refuse every update (docs/RELEASE_SIGNING.md)"; fi
          packaging/windows/collect-licenses.sh dist "$(cygpath -u "$GITHUB_WORKSPACE")/.deps"
          echo "Top level:"; ls dist
          echo "Files in app: $(find dist/app -type f | wc -l)"
          echo "Total size:"; du -sh dist
          # The full list, to check against docs/DEPENDENCIES.md.
          echo "DLLs shipped:"; (cd dist/app && ls *.dll | tr '\n' ' '); echo
          echo "Biggest files:"; find dist -type f -printf '%s %p\n' | sort -rn | awk 'NR <= 60 {printf "%7.1f MB  %s\n", $1/1048576, $2}'

      # build.txt names the build; manifest.txt lists every file with its
      # SHA-256. The next build compares against it to make an update package.
      - name: Stamp the build
        run: |
          cd dist
          echo "build ${{ github.run_number }} (${GITHUB_SHA::7})" > build.txt
          find . -type f ! -name manifest.txt ! -name manifest.sig | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s\t%s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
          done > manifest.txt
          cat build.txt; wc -l < manifest.txt

      # manifest.sig: the updater's proof that build.txt and manifest.txt
      # came from this CI. Needs the UPDATE_SIGNING_KEY secret.
      - name: Sign the build for the updater
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { Write-Host "No UPDATE_SIGNING_KEY secret: build not signed, its update package will be refused"; exit 0 }
          packaging/windows/updater/sign-manifest.ps1 -Folder dist -KeyXml $env:UPDATE_SIGNING_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: CorporalJackie-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: CorporalJackie-windows-manifest
          path: |
            dist/build.txt
            dist/manifest.txt
            dist/manifest.sig

      # The update package: only the files that changed since the last main
      # build that has a manifest (see packaging/windows/README-update.txt).
      - name: Get the previous build's manifest
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=CorporalJackie-windows-manifest&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")
                   | select(.workflow_run.id != ${{ github.run_id }})] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run" ]; then echo "No earlier manifest: no update package this time"; exit 0; fi
          echo "Previous build: run $run"
          gh run download "$run" -R "${{ github.repository }}" -n CorporalJackie-windows-manifest -D previous
          cat previous/build.txt

      - name: Make the update package
        if: github.ref == 'refs/heads/main' && hashFiles('previous/manifest.txt') != ''
        run: packaging/windows/make-update.sh dist previous update

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && hashFiles('update/manifest.txt') != ''
        with:
          name: CorporalJackie-windows-x64-update
          path: update/

      # Runs the packaged app the way a user would: outside MSYS2, with only
      # Windows' own folders on PATH, so a missing DLL or plugin fails here.
      # The runner has no GPU, so a test copy gets Mesa's software OpenGL
      # (llvmpipe) next to the exe; the shipped package does not include it.
      - name: Prepare a test copy with software OpenGL
        timeout-minutes: 5
        run: |
          rm -rf dist-test && cp -r dist dist-test
          for f in opengl32.dll libgallium_wgl.dll; do
            p=$(find /ucrt64/bin -iname "$f" | head -1)
            [ -n "$p" ] && cp "$p" dist-test/app/ && echo "added $p"
          done
          for f in dist-test/app/opengl32.dll dist-test/app/libgallium_wgl.dll; do
            [ -f "$f" ] && ldd "$f" | awk '/\/ucrt64\// {print $3}'
          done | sort -u | xargs -r -I{} cp -n {} dist-test/app/

      - name: Run packaged app with the test clip
        timeout-minutes: 3
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          CJ_MPV_OPTS: gpu-dumb-mode=yes
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $clip = Resolve-Path tests\data\testsrc-10s.mkv
          $p = Start-Process -FilePath dist-test\CorporalJackie.exe -ArgumentList '--smoke-test', "`"$clip`"" -PassThru
          $null = $p.Handle  # keeps the exit code readable after the process ends
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Host "App did not exit within 60 s" }
          $log = Join-Path $env:APPDATA 'Corporal Jackie\logs\corporal-jackie.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log file at $log" }
          Write-Host "Exit code: $($p.ExitCode)"
          exit $p.ExitCode

  # The Windows updater on real folders: valid update, damaged file, forged
  # signature, path traversal, links, a file in use, an interrupted update.
  updater:
    name: Windows updater
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: tests\updater\Test-Updater.ps1
      - name: PowerShell 7
        shell: pwsh
        run: tests\updater\Test-Updater.ps1

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt mpv libtorrent-rasterbar ninja pkgconf

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: ctest --test-dir build -LE bench --output-on-failure

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: ctest --test-dir build -L bench -V

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/src/app/CorporalJackie.app/Contents/MacOS/CorporalJackie --smoke-test

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/src/app/CorporalJackie.app dist/
          "$(brew --prefix qt)/bin/macdeployqt" dist/CorporalJackie.app -qmldir=src/ui -verbose=1
          # The bundle ships only the cocoa platform plugin; the runner has a GUI session.
          ./dist/CorporalJackie.app/Contents/MacOS/CorporalJackie --smoke-test
          cp LICENSE dist/LICENSE.txt
          packaging/macos/collect-licenses.sh dist
          ditto -c -k --keepParent dist CorporalJackie-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CorporalJackie-macos-arm64
          path: CorporalJackie-macos-arm64.zip

  linux:
    name: Linux (build and test only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config xvfb libgl1-mesa-dri \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-shapes \
            libmpv-dev libtorrent-rasterbar-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: ctest --test-dir build -LE bench --output-on-failure

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: ctest --test-dir build -L bench -V

      # Real rendering on Mesa's software OpenGL: opens the window and plays the
      # test clip. gpu-dumb-mode works around a Mesa llvmpipe issue with mpv's
      # 16-bit float buffers that would otherwise give a black picture.
      - name: Smoke test with video
        env:
          CJ_MPV_OPTS: gpu-dumb-mode=yes
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./build/src/app/CorporalJackie --smoke-test tests/data/testsrc-10s.mkv

  sanitizers:
    name: Linux (tests under ASan and UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-shapes \
            libmpv-dev libtorrent-rasterbar-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCJ_WARNINGS_AS_ERRORS=ON -DCJ_SANITIZE=ON

      - name: Build
        run: cmake --build build --target all

      # Memory errors and undefined behaviour stop the test. Leaks are not
      # checked: Qt, mpv and fontconfig keep caches until exit on purpose.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QTEST_FUNCTION_TIMEOUT: "250000"
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -LE bench --output-on-failure

  # Data races between the broker's and the database's own threads. Qt, glib
  # and libtorrent are not built with TSan, so hand-offs inside them are
  # suppressed (tests/tsan.supp); the network code that hands work over
  # through Qt's event queues is left to ASan and its tests.
  thread-sanitizer:
    name: Linux (broker and storage under TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev libmpv-dev libtorrent-rasterbar-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCJ_WARNINGS_AS_ERRORS=ON -DCJ_SANITIZE_THREAD=ON

      - name: Build
        run: cmake --build build --target tst_broker tst_storage

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QTEST_FUNCTION_TIMEOUT: "250000"
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tests/tsan.supp
        run: |
          build/tests/tst_broker
          build/tests/tst_storage

  # libFuzzer on the parsers of untrusted text (tests/fuzz/fuzz_parsers.cpp)
  # with ASan and UBSan, for five minutes from the seed corpus.
  fuzz:
    name: Linux (parser fuzzing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang libclang-rt-dev \
            qt6-base-dev qt6-declarative-dev libmpv-dev libtorrent-rasterbar-dev libsqlite3-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCJ_BUILD_TESTS=OFF -DCJ_FUZZ=ON

      - name: Build
        run: cmake --build build --target fuzz_parsers

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p corpus findings
          build/tests/fuzz/fuzz_parsers -max_total_time=300 -max_len=8192 -timeout=10 -rss_limit_mb=4096 \
            -artifact_prefix=findings/ corpus tests/fuzz/corpus

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: findings/
