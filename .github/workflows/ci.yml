name: CI
on:
  push:
    branches: [audit/verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config xvfb libgl1-mesa-dri qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-shapes libmpv-dev libtorrent-rasterbar-dev libsqlite3-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 4
      - name: Baseline suite and new regression cases
        env:
          QT_QPA_PLATFORM: offscreen
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: ctest --test-dir build -LE bench --output-on-failure
      - name: Benchmark
        if: success() || failure()
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
          CJ_BENCH_OUT: /tmp/audit-benchmark.jsonl
        run: ctest --test-dir build -L bench -V
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: |
            build/tests/*.log
            build/Testing/Temporary/LastTest.log
            /tmp/audit-benchmark.jsonl
