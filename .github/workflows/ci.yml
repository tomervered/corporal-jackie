name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Run on main with a tag such as v0.1.0 to publish a GitHub release from this run's Windows and macOS builds"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read   # the previous build's manifest, for the update package
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2, updated: downloading the installer
          # failed with HTTP 504 in three runs on 2026-11-09.
          release: false
          update: true
          install: git make diffutils
          # mpv is built by packaging/windows/build-mpv.sh (playback only);
          # these are its dependencies.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p meson:p nasm:p
            qt6-base:p qt6-declarative:p qt6-tools:p
            boost:p openssl:p sqlite3:p mesa:p
            dav1d:p libass:p lcms2:p uchardet:p zimg:p libdovi:p libiconv:p

      # Both builds are saved as soon as they are done, so a failing test
      # later in the job does not make the next run build them again.
      - name: Restore the mpv build
        id: mpv-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: mpv-${{ runner.os }}-${{ hashFiles('packaging/windows/build-mpv.sh') }}

      - name: Build FFmpeg, libplacebo and mpv (playback only)
        timeout-minutes: 40
        run: packaging/windows/build-mpv.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps"

      - name: Save the mpv build
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps
          key: mpv-${{ runner.os }}-${{ hashFiles('packaging/windows/build-mpv.sh') }}

      # libtorrent with our patch, as a static library (third_party/libtorrent).
      - name: Restore the libtorrent build
        id: lt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps-torrent
          key: libtorrent-${{ runner.os }}-${{ hashFiles('third_party/libtorrent/**') }}

      - name: Build libtorrent
        run: third_party/libtorrent/build.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps-torrent"

      - name: Save the libtorrent build
        if: steps.lt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps-torrent
          key: libtorrent-${{ runner.os }}-${{ hashFiles('third_party/libtorrent/**') }}

      - name: Configure
        run: |
          DEPS="$(cygpath -u "$GITHUB_WORKSPACE")/.deps"
          export PATH="$DEPS/bin:$PATH" PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(cygpath -m "$DEPS");$(cygpath -m "$GITHUB_WORKSPACE/.deps-torrent")" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build

      # Boost.Asio's Windows timers run on a thread of their own, and
      # libtorrent's connections start from a timer. Fires 5 short timers in
      # 300 fresh io_contexts and says how many never finished.
      - name: Probe Boost.Asio timers
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          timeout 180 build/tests/asio_timer_probe

      # Starts and ends libtorrent sessions at random moments while every
      # core is busy: the Windows crash was an access violation in Asio's
      # timer thread after its io_context was gone. Three seeds; a crash
      # shows as a non-zero exit code here.
      - name: Probe libtorrent session teardown
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          for seed in 1 2 3; do
            timeout 600 build/tests/session_churn_probe 400 4 "$seed" || { echo "session_churn_probe seed $seed exited with $?"; exit 1; }
          done

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          ctest --test-dir build -LE bench --output-on-failure

      # The console output of a hung test is lost on Windows; the logs keep it.
      - name: Test logs
        if: failure()
        run: for f in build/tests/*.log; do echo "== $f"; tail -n 400 "$f"; done

      # A crash inside libtorrent shows only "SegFault"; run the broker test
      # under gdb for a stack trace.
      - name: Crash trace
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gdb >/dev/null
          # gdb stops at every access violation, including any libtorrent
          # handles itself. Continue past them and show the last stop.
          { echo "set pagination off"; echo run
            for i in $(seq 200); do printf '%s\n' bt 'info symbol $pc' 'x/6i $pc-12' continue; done
            echo "info sharedlibrary"; } > gdb.cmd
          gdb -batch -x gdb.cmd --args build/tests/tst_broker.exe > gdb.txt 2>&1 || true
          grep -c "received signal" gdb.txt || true
          grep -E "received signal|exited" gdb.txt | tail -3
          awk '/received signal/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' gdb.txt | head -60
          grep -i "libtorrent" gdb.txt | grep -i "0x" | head -3

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          # Temporary files on the runner's fast drive (the runner's MSYS2 keeps /tmp on C:).
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          ctest --test-dir build -L bench -V

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          ./build/src/app/CorporalJackie.exe --smoke-test

      # The shipped folder: the small launcher and the license at the top, and
      # the real app with all its DLLs, plugins and QML in app\.
      - name: Package
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          rm -rf dist && mkdir -p dist/app
          cp build/src/app/CorporalJackie.exe dist/app/
          WDQ=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)
          "$WDQ" --release --qmldir src/ui --no-translations \
            --skip-plugin-types qmltooling,generic,networkinformation dist/app/CorporalJackie.exe
          # The app uses the Basic control style only. windeployqt copies every
          # style Qt ships (Material, Fluent, Imagine...), about 30 MB never loaded.
          for style in Material Universal Imagine Fusion FluentWinUI3 Windows; do
            rm -rf "dist/app/qml/QtQuick/Controls/$style"
            rm -f dist/app/Qt6QuickControls2${style}.dll dist/app/Qt6QuickControls2${style}StyleImpl.dll
          done
          rm -rf dist/app/qml/QtQuick/NativeStyle dist/app/Qt6QuickNativeStyle.dll
          # Copy every DLL the app and its Qt plugins need: our mpv build, and
          # MSYS2's Qt, libtorrent and the rest.
          for f in dist/app/CorporalJackie.exe $(find dist/app -name '*.dll'); do
            ldd "$f" | awk '/\/ucrt64\/|\/\.deps\// {print $3}'
          done | sort -u | xargs -r -I{} cp -n {} dist/app/
          # Point Qt at the bundled plugins and QML modules instead of /ucrt64.
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' > dist/app/qt.conf
          cp build/launcher/CorporalJackie.exe dist/
          # The launcher must not need any DLL that is not part of Windows.
          if ldd dist/CorporalJackie.exe | grep -i ucrt64; then echo "launcher depends on MSYS2 DLLs"; exit 1; fi
          cp LICENSE dist/LICENSE.txt
          # The updater ships with the app, so an update package carries only
          # data: the checks it must pass come from the installed copy.
          mkdir -p dist/app/updater
          cp packaging/windows/updater/apply-update.ps1 dist/app/updater/
          cp "packaging/windows/updater/Update Corporal Jackie.cmd" dist/
          if [ -f packaging/windows/update-key.xml ]; then cp packaging/windows/update-key.xml dist/app/updater/
          else echo "No packaging/windows/update-key.xml: this build will refuse every update (docs/RELEASE_SIGNING.md)"; fi
          packaging/windows/collect-licenses.sh dist "$(cygpath -u "$GITHUB_WORKSPACE")/.deps" "$(cygpath -u "$GITHUB_WORKSPACE")/.deps-torrent"
          echo "Top level:"; ls dist
          echo "Files in app: $(find dist/app -type f | wc -l)"
          echo "Total size:"; du -sh dist
          # The full list, to check against docs/DEPENDENCIES.md.
          echo "DLLs shipped:"; (cd dist/app && ls *.dll | tr '\n' ' '); echo
          echo "Biggest files:"; find dist -type f -printf '%s %p\n' | sort -rn | awk 'NR <= 60 {printf "%7.1f MB  %s\n", $1/1048576, $2}'

      # build.txt names the build; manifest.txt lists every file with its
      # SHA-256. The next build compares against it to make an update package.
      - name: Stamp the build
        run: |
          cd dist
          echo "build ${{ github.run_number }} (${GITHUB_SHA::7})" > build.txt
          find . -type f ! -name manifest.txt ! -name manifest.sig | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s\t%s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
          done > manifest.txt
          cat build.txt; wc -l < manifest.txt

      # manifest.sig: the updater's proof that build.txt and manifest.txt
      # came from this CI. Needs the UPDATE_SIGNING_KEY secret.
      - name: Sign the build for the updater
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { Write-Host "No UPDATE_SIGNING_KEY secret: build not signed, its update package will be refused"; exit 0 }
          packaging/windows/updater/sign-manifest.ps1 -Folder dist -KeyXml $env:UPDATE_SIGNING_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: CorporalJackie-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: CorporalJackie-windows-manifest
          path: |
            dist/build.txt
            dist/manifest.txt
            dist/manifest.sig

      # The update package: only the files that changed since the last main
      # build that has a manifest (see packaging/windows/README-update.txt).
      - name: Get the previous build's manifest
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=CorporalJackie-windows-manifest&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")
                   | select(.workflow_run.id != ${{ github.run_id }})] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run" ]; then echo "No earlier manifest: no update package this time"; exit 0; fi
          echo "Previous build: run $run"
          gh run download "$run" -R "${{ github.repository }}" -n CorporalJackie-windows-manifest -D previous
          cat previous/build.txt

      - name: Make the update package
        if: github.ref == 'refs/heads/main' && hashFiles('previous/manifest.txt') != ''
        run: packaging/windows/make-update.sh dist previous update

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && hashFiles('update/manifest.txt') != ''
        with:
          name: CorporalJackie-windows-x64-update
          path: update/

      # Runs the packaged app the way a user would: outside MSYS2, with only
      # Windows' own folders on PATH, so a missing DLL or plugin fails here.
      # The runner has no GPU, so a test copy gets Mesa's software OpenGL
      # (llvmpipe) next to the exe; the shipped package does not include it.
      - name: Prepare a test copy with software OpenGL
        timeout-minutes: 5
        run: |
          rm -rf dist-test && cp -r dist dist-test
          for f in opengl32.dll libgallium_wgl.dll; do
            p=$(find /ucrt64/bin -iname "$f" | head -1)
            [ -n "$p" ] && cp "$p" dist-test/app/ && echo "added $p"
          done
          for f in dist-test/app/opengl32.dll dist-test/app/libgallium_wgl.dll; do
            [ -f "$f" ] && ldd "$f" | awk '/\/ucrt64\// {print $3}'
          done | sort -u | xargs -r -I{} cp -n {} dist-test/app/

      - name: Run packaged app with the test clip
        timeout-minutes: 3
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          CJ_MPV_OPTS: gpu-dumb-mode=yes
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $clip = Resolve-Path tests\data\testsrc-10s.mkv
          $p = Start-Process -FilePath dist-test\CorporalJackie.exe -ArgumentList '--smoke-test', "`"$clip`"" -PassThru
          $null = $p.Handle  # keeps the exit code readable after the process ends
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Host "App did not exit within 60 s" }
          $log = Join-Path $env:APPDATA 'Corporal Jackie\logs\corporal-jackie.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log file at $log" }
          Write-Host "Exit code: $($p.ExitCode)"
          exit $p.ExitCode

      # The update flow on the real package: the test copy above as the
      # install, a next build made from this one (a changed file, a new file,
      # a higher build number), signed with a key made here and thrown away,
      # packaged by make-update.sh, applied by the installed updater, and
      # the updated app played again.
      - name: Make a key for the update test
        shell: pwsh
        run: |
          $rsa = New-Object Security.Cryptography.RSACryptoServiceProvider 2048
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\update-test-private.xml", $rsa.ToXmlString($true))
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\update-test-public.xml", $rsa.ToXmlString($false))

      - name: Make the next build for the update test
        run: |
          key="$(cygpath -u "$RUNNER_TEMP")/update-test-public.xml"
          rm -rf upd-old upd-new upd-pkg
          cp -r dist-test upd-old
          cp -r dist upd-new
          cp "$key" upd-old/app/updater/update-key.xml
          cp "$key" upd-new/app/updater/update-key.xml
          echo "Changed by the update test." >> upd-new/LICENSE.txt
          echo "Added by the update test." > upd-new/app/updater/update-test.txt
          echo "build $(( ${{ github.run_number }} + 1 )) (update test)" > upd-new/build.txt
          (cd upd-new && find . -type f ! -name manifest.txt ! -name manifest.sig | sed 's|^\./||' | LC_ALL=C sort \
            | while IFS= read -r f; do printf '%s\t%s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"; done > manifest.txt)

      - name: Sign the next build with the test key
        shell: pwsh
        run: packaging/windows/updater/sign-manifest.ps1 -Folder upd-new -KeyXml ([IO.File]::ReadAllText("$env:RUNNER_TEMP\update-test-private.xml"))

      - name: Package the update
        run: packaging/windows/make-update.sh upd-new upd-old upd-pkg

      - name: Apply the update and play the updated app
        timeout-minutes: 5
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          CJ_MPV_OPTS: gpu-dumb-mode=yes
        run: |
          & upd-old\app\updater\apply-update.ps1 -Package upd-pkg -Root upd-old -NoPause
          if ($LASTEXITCODE -ne 0) { throw "The updater exited with $LASTEXITCODE" }
          $build = (Get-Content upd-old\build.txt -Raw).Trim()
          if ($build -ne "build $(${{ github.run_number }} + 1) (update test)") { throw "build.txt says '$build'" }
          if (-not (Test-Path upd-old\app\updater\update-test.txt)) { throw "the new file is missing" }
          if ((Get-FileHash upd-old\LICENSE.txt).Hash -ne (Get-FileHash upd-new\LICENSE.txt).Hash) { throw "LICENSE.txt was not replaced" }
          if (Test-Path upd-old\.update-journal) { throw "a journal was left" }
          # The same package again is refused: it is not newer.
          & upd-old\app\updater\apply-update.ps1 -Package upd-pkg -Root upd-old -NoPause
          if ($LASTEXITCODE -eq 0) { throw "a replayed update was applied" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $clip = Resolve-Path tests\data\testsrc-10s.mkv
          $p = Start-Process -FilePath upd-old\CorporalJackie.exe -ArgumentList '--smoke-test', "`"$clip`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "The updated app did not exit within 60 s" }
          Write-Host "Updated app exit code: $($p.ExitCode)"
          exit $p.ExitCode

  # The Windows updater on real folders: valid update, damaged file, forged
  # signature, path traversal, links, a file in use, an interrupted update.
  updater:
    name: Windows updater
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: tests\updater\Test-Updater.ps1
      - name: PowerShell 7
        shell: pwsh
        run: tests\updater\Test-Updater.ps1

  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt mpv boost openssl@3 ninja pkgconf

      - uses: ./.github/actions/libtorrent

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: ctest --test-dir build -LE bench --output-on-failure

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: ctest --test-dir build -L bench -V

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/src/app/CorporalJackie.app/Contents/MacOS/CorporalJackie --smoke-test

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/src/app/CorporalJackie.app dist/
          "$(brew --prefix qt)/bin/macdeployqt" dist/CorporalJackie.app -qmldir=src/ui -verbose=1
          # The bundle ships only the cocoa platform plugin; the runner has a GUI session.
          ./dist/CorporalJackie.app/Contents/MacOS/CorporalJackie --smoke-test
          cp LICENSE dist/LICENSE.txt
          packaging/macos/collect-licenses.sh dist "$CJ_LT_PREFIX"
          ditto -c -k --keepParent dist CorporalJackie-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CorporalJackie-macos-arm64
          path: CorporalJackie-macos-arm64.zip

  linux:
    name: Linux (build and test only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # Plain HTTP to Ubuntu's mirrors timed out on every request on 2026-11-11
          # (azure.archive.ubuntu.com and archive.ubuntu.com); HTTPS answered.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/	priority:1' 'http://azure.archive.ubuntu.com/ubuntu/	priority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 install -y ninja-build pkg-config xvfb libgl1-mesa-dri \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-shapes \
            libmpv-dev libboost-dev libssl-dev libsqlite3-dev

      - uses: ./.github/actions/libtorrent

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt's per-function watchdog fires before ctest's 300 s limit and
          # names the hung test function (ctest shows nothing on a timeout).
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: ctest --test-dir build -LE bench --output-on-failure

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "3"
        run: ctest --test-dir build -L bench -V

      # Real rendering on Mesa's software OpenGL: opens the window and plays the
      # test clip. gpu-dumb-mode works around a Mesa llvmpipe issue with mpv's
      # 16-bit float buffers that would otherwise give a black picture.
      - name: Smoke test with video
        env:
          CJ_MPV_OPTS: gpu-dumb-mode=yes
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./build/src/app/CorporalJackie --smoke-test tests/data/testsrc-10s.mkv

  sanitizers:
    name: Linux (tests under ASan and UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # Plain HTTP to Ubuntu's mirrors timed out on every request on 2026-11-11
          # (azure.archive.ubuntu.com and archive.ubuntu.com); HTTPS answered.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/	priority:1' 'http://azure.archive.ubuntu.com/ubuntu/	priority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 install -y ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-shapes \
            libmpv-dev libboost-dev libssl-dev libsqlite3-dev

      - uses: ./.github/actions/libtorrent

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCJ_WARNINGS_AS_ERRORS=ON -DCJ_SANITIZE=ON -DCMAKE_PREFIX_PATH="$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target all

      # Memory errors and undefined behaviour stop the test. Leaks are not
      # checked: Qt, mpv and fontconfig keep caches until exit on purpose.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QTEST_FUNCTION_TIMEOUT: "250000"
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build -LE bench --output-on-failure

  # Data races between the broker's and the database's own threads. Qt, glib
  # and libtorrent are not built with TSan, so hand-offs inside them are
  # suppressed (tests/tsan.supp); the network code that hands work over
  # through Qt's event queues is left to ASan and its tests.
  thread-sanitizer:
    name: Linux (broker and storage under TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # Plain HTTP to Ubuntu's mirrors timed out on every request on 2026-11-11
          # (azure.archive.ubuntu.com and archive.ubuntu.com); HTTPS answered.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/	priority:1' 'http://azure.archive.ubuntu.com/ubuntu/	priority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 install -y ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev libmpv-dev libboost-dev libssl-dev libsqlite3-dev

      - uses: ./.github/actions/libtorrent

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCJ_WARNINGS_AS_ERRORS=ON -DCJ_SANITIZE_THREAD=ON -DCMAKE_PREFIX_PATH="$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target tst_broker tst_storage

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QTEST_FUNCTION_TIMEOUT: "250000"
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tests/tsan.supp
        run: |
          build/tests/tst_broker
          build/tests/tst_storage

  # libFuzzer on the parsers of untrusted text (tests/fuzz/fuzz_parsers.cpp)
  # with ASan and UBSan, for five minutes from the seed corpus.
  fuzz:
    name: Linux (parser fuzzing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # Plain HTTP to Ubuntu's mirrors timed out on every request on 2026-11-11
          # (azure.archive.ubuntu.com and archive.ubuntu.com); HTTPS answered.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/	priority:1' 'http://azure.archive.ubuntu.com/ubuntu/	priority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 install -y ninja-build pkg-config clang libclang-rt-dev \
            qt6-base-dev qt6-declarative-dev libmpv-dev libboost-dev libssl-dev libsqlite3-dev

      - uses: ./.github/actions/libtorrent

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCJ_BUILD_TESTS=OFF -DCJ_FUZZ=ON -DCMAKE_PREFIX_PATH="$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target fuzz_parsers

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p corpus findings
          build/tests/fuzz/fuzz_parsers -max_total_time=300 -max_len=8192 -timeout=10 -rss_limit_mb=4096 \
            -artifact_prefix=findings/ corpus tests/fuzz/corpus

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: findings/

  # The torrent benchmark against other clients and against the release
  # before the audit, on the same seeders and read pattern
  # (tests/bench/competitor.cjs), on plain loopback and on a link with 40 ms
  # round trips and 0.5 % loss (netem on lo). Clients run in a shuffled
  # order, five runs per row, each tst_bench call after a warm-up run. Every
  # run, failed ones included, goes into the summary and the artifact.
  bench-compare:
    name: Linux (benchmark against other clients)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # The release before the audit fixes, built with the measurement
      # counters (tests/bench/baseline-counters.patch, from 6948b5f) and
      # nothing else.
      BASELINE: c6557a3a345f20d7a38b6cbd4562b246e5c18122
      STREMIO_IMAGE: stremio/server:v4.22.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # Plain HTTP to Ubuntu's mirrors timed out on every request on 2026-11-11
          # (azure.archive.ubuntu.com and archive.ubuntu.com); HTTPS answered.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/	priority:1' 'http://azure.archive.ubuntu.com/ubuntu/	priority:2' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dpkg::Lock::Timeout=120 install -y ninja-build pkg-config iproute2 qbittorrent-nox \
            qt6-base-dev qt6-declarative-dev libmpv-dev libtorrent-rasterbar-dev libboost-dev libssl-dev libsqlite3-dev
          npm install --prefix "$RUNNER_TEMP/contenders" --ignore-scripts --no-audit --no-fund \
            webtorrent@3.0.21 webtorrent1@npm:webtorrent@1.9.7 torrent-stream@1.2.1
          # WebTorrent 3 loads WebRTC at start; only this package's install
          # script runs, to fetch its prebuilt binary.
          npm rebuild --prefix "$RUNNER_TEMP/contenders" node-datachannel
          docker pull "$STREMIO_IMAGE"

      - uses: ./.github/actions/libtorrent

      - name: Build
        run: |
          # The release under test uses the patched libtorrent; the previous
          # release was measured with the distribution's.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON
          cmake --build build --target tst_bench bench_player
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE"
          git -C "$RUNNER_TEMP/baseline" apply "$GITHUB_WORKSPACE/tests/bench/baseline-counters.patch"
          cmake -S "$RUNNER_TEMP/baseline" -B "$RUNNER_TEMP/baseline/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/baseline/build" --target bench_player

      - name: Benchmark
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_BENCH_RUNS: "5"
          # One test function runs every row; on the lossy link Jackie's 20
          # rows took past Qt's default 5 minutes and the last ones were lost.
          QTEST_FUNCTION_TIMEOUT: "3600000"
          CJ_BENCH_OUT: ${{ runner.temp }}/bench.jsonl
          CJ_COMPETITOR_MODULES: ${{ runner.temp }}/contenders/node_modules
          CJ_STREMIO_IMAGE: ${{ env.STREMIO_IMAGE }}
        run: |
          disk_rows=()
          for i in 1 2 3 4 5; do disk_rows+=("run:disk $i" "run:swarm disk $i"); done
          run_all() {
            # Only the clients the work is measured against. The others (torrent-stream,
            # qbittorrent, stremio) and the previous release (jackie-c6557a3) are still
            # handled below: add one to this list to run it.
            for engine in $(printf '%s\n' jackie webtorrent webtorrent1 | shuf); do
              echo "::group::$CJ_BENCH_LINK: $engine"
              case $engine in
                jackie)
                  ./build/tests/tst_bench || echo "$engine: some runs failed" ;;
                jackie-c6557a3)
                  CJ_BENCH_PLAYER_PATH="$RUNNER_TEMP/baseline/build/tests/bench_player" CJ_BENCH_LABEL=$engine \
                    ./build/tests/tst_bench || echo "$engine: some runs failed" ;;
                *)
                  # The other clients keep everything on disk: no RAM rows.
                  CJ_COMPETITOR=$engine CJ_BENCH_EXTERNAL=tests/bench/competitor.cjs ./build/tests/tst_bench \
                    "${disk_rows[@]}" || echo "$engine: some runs failed" ;;
              esac
              echo "::endgroup::"
            done
          }
          CJ_BENCH_LINK=loopback run_all
          sudo tc qdisc add dev lo root netem delay 20ms loss 0.5%
          CJ_BENCH_LINK="40ms RTT, 0.5% loss" run_all
          sudo tc qdisc del dev lo root
          python3 tests/bench/summarize.py "$CJ_BENCH_OUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/bench.jsonl

  # Publishes the Windows and macOS builds of this very run as a GitHub
  # release. Only when started by hand on main with a release_tag; the
  # builds are not code-signed (README says so).
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CorporalJackie-windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: CorporalJackie-macos-arm64
          path: macos
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          (cd windows && zip -qr ../CorporalJackie-windows-x64.zip .)
          cat > notes.md <<EOF
          First public build of Corporal Jackie, a hobby media player (GPL-3.0). Commit ${GITHUB_SHA::7}.

          - **Not code-signed.** Windows SmartScreen and macOS Gatekeeper will warn on first run. Updates are manual: download the new build.
          - **Windows:** unzip CorporalJackie-windows-x64.zip and run CorporalJackie.exe.
          - **macOS (Apple silicon):** unzip CorporalJackie-macos-arm64.zip, then right-click the app and choose Open the first time.
          - Nothing contacts Cinemeta, the DHT or open trackers until you answer the first-run screen. What the app sends and keeps: docs/PRIVACY.md.
          - Use it only for videos you have the right to watch and share. Not affiliated with Stremio.
          EOF
          gh release create "$TAG" CorporalJackie-windows-x64.zip macos/CorporalJackie-macos-arm64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Corporal Jackie $TAG" --notes-file notes.md
