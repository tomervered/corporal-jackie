name: Loopback diagnostic

# Windows only: why tests sometimes get no metadata from a seeder on
# 127.0.0.1. Runs tests/diag/loopback_probe and the torrent tests with
# libtorrent's peer logging on.
on:
  push:
    branches: [claude/project-thread-vsy33n]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows loopback probe
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2, updated: downloading the installer
          # failed with HTTP 504 in three runs on 2026-11-09.
          release: false
          update: true
          install: git make diffutils
          # mpv is built by packaging/windows/build-mpv.sh (playback only);
          # these are its dependencies.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p meson:p nasm:p
            qt6-base:p qt6-declarative:p qt6-tools:p qt6-imageformats:p
            boost:p openssl:p sqlite3:p mesa:p
            dav1d:p libass:p lcms2:p uchardet:p zimg:p libdovi:p libiconv:p

      # Both builds are saved as soon as they are done, so a failing test
      # later in the job does not make the next run build them again.
      - name: Restore the mpv build
        id: mpv-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: mpv-${{ runner.os }}-${{ hashFiles('packaging/windows/build-mpv.sh') }}

      - name: Build FFmpeg, libplacebo and mpv (playback only)
        timeout-minutes: 40
        run: packaging/windows/build-mpv.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps"

      # libtorrent with our patch, as a static library (third_party/libtorrent).
      - name: Restore the libtorrent build
        id: lt-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps-torrent
          key: libtorrent-${{ runner.os }}-${{ hashFiles('third_party/libtorrent/**') }}

      - name: Build libtorrent
        run: third_party/libtorrent/build.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps-torrent"

      - name: Configure
        run: |
          DEPS="$(cygpath -u "$GITHUB_WORKSPACE")/.deps"
          export PATH="$DEPS/bin:$PATH" PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(cygpath -m "$DEPS");$(cygpath -m "$GITHUB_WORKSPACE/.deps-torrent")" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target loopback_probe tst_broker tst_bench bench_player tst_torrentstream

      - name: Probe, fresh seeder each round
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          timeout 1200 build/tests/loopback_probe 300 15000 0 0 > probe-fresh.txt 2>&1; echo "exit $?"
          grep -E "rounds|done" probe-fresh.txt; grep -A80 "NO METADATA\|listen error" probe-fresh.txt | head -300

      - name: Probe, one seeder, busy cores
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          timeout 1200 build/tests/loopback_probe 300 15000 4 1 > probe-reuse.txt 2>&1; echo "exit $?"
          grep -E "rounds|done" probe-reuse.txt; grep -A80 "NO METADATA\|listen error" probe-reuse.txt | head -300

      - name: Torrent tests with peer logging, five times
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_TORRENT_LOG: "1"
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          mkdir -p diag-logs
          for i in 1 2 3 4 5; do
            build/tests/tst_broker.exe -maxwarnings 0 -o "diag-logs/tst_broker-$i.txt,txt" || echo "tst_broker run $i failed"
            build/tests/tst_torrentstream.exe -maxwarnings 0 -o "diag-logs/tst_torrentstream-$i.txt,txt" || echo "tst_torrentstream run $i failed"
          done
          grep -h "FAIL!\|No metadata\|Totals" diag-logs/*.txt || true

      - name: Benchmark with peer logging
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_TORRENT_LOG: "1"
          CJ_BENCH_RUNS: "3"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          build/tests/tst_bench.exe -o "diag-logs/tst_bench.txt,txt" > diag-logs/tst_bench-console.txt 2>&1 || echo "tst_bench failed"
          grep -h "FAIL!\|No metadata\|Totals" diag-logs/tst_bench*.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopback-diagnostic
          path: |
            probe-*.txt
            diag-logs/
