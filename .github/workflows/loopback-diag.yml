name: Loopback diagnostic

# Windows: why tests sometimes get no metadata from a seeder on
# 127.0.0.1. Runs tests/diag/loopback_probe and the torrent tests with
# libtorrent's peer logging on.
# Start it by hand (Actions > Loopback diagnostic > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows loopback probe
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2, updated: downloading the installer
          # failed with HTTP 504 in three runs on 2026-11-09.
          release: false
          update: true
          install: git make diffutils
          # mpv is built by packaging/windows/build-mpv.sh (playback only);
          # these are its dependencies.
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p meson:p nasm:p
            qt6-base:p qt6-declarative:p qt6-tools:p qt6-imageformats:p
            boost:p openssl:p sqlite3:p mesa:p
            dav1d:p libass:p lcms2:p uchardet:p zimg:p libdovi:p libiconv:p

      # Both builds are saved as soon as they are done, so a failing test
      # later in the job does not make the next run build them again.
      - name: Restore the mpv build
        id: mpv-cache
        uses: actions/cache/restore@v6
        with:
          path: .deps
          key: mpv-${{ runner.os }}-${{ hashFiles('packaging/windows/build-mpv.sh') }}

      - name: Build FFmpeg, libplacebo and mpv (playback only)
        timeout-minutes: 40
        run: packaging/windows/build-mpv.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps"

      # libtorrent with our patch, as a static library (third_party/libtorrent).
      - name: Restore the libtorrent build
        id: lt-cache
        uses: actions/cache/restore@v6
        with:
          path: .deps-torrent
          key: libtorrent-${{ runner.os }}-${{ hashFiles('third_party/libtorrent/**') }}

      - name: Build libtorrent
        run: third_party/libtorrent/build.sh "$(cygpath -u "$GITHUB_WORKSPACE")/.deps-torrent"

      - name: Configure
        run: |
          DEPS="$(cygpath -u "$GITHUB_WORKSPACE")/.deps"
          export PATH="$DEPS/bin:$PATH" PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCJ_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(cygpath -m "$DEPS");$(cygpath -m "$GITHUB_WORKSPACE/.deps-torrent")" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target loopback_probe tst_broker tst_bench bench_player tst_torrentstream

      - name: Probe, fresh seeder each round
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          timeout 1200 build/tests/loopback_probe 300 15000 0 0 > probe-fresh.txt 2>&1; echo "exit $?"
          grep -E "rounds|done" probe-fresh.txt; grep -A80 "NO METADATA\|listen error" probe-fresh.txt | head -300

      - name: Probe, one seeder, busy cores
        continue-on-error: true
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          timeout 1200 build/tests/loopback_probe 300 15000 4 1 > probe-reuse.txt 2>&1; echo "exit $?"
          grep -E "rounds|done" probe-reuse.txt; grep -A80 "NO METADATA\|listen error" probe-reuse.txt | head -300

      - name: Torrent tests with peer logging, five times
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_TORRENT_LOG: "1"
          QTEST_FUNCTION_TIMEOUT: "150000"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          mkdir -p diag-logs
          for i in 1 2 3 4 5; do
            build/tests/tst_broker.exe -maxwarnings 0 -o "diag-logs/tst_broker-$i.txt,txt" || echo "tst_broker run $i failed"
            build/tests/tst_torrentstream.exe -maxwarnings 0 -o "diag-logs/tst_torrentstream-$i.txt,txt" || echo "tst_torrentstream run $i failed"
          done
          grep -h "FAIL!\|No metadata\|Totals" diag-logs/*.txt || true

      - name: Benchmark with peer logging
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          CJ_TORRENT_LOG: "1"
          CJ_BENCH_RUNS: "3"
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/.deps/bin:$PATH"
          export TMP="$(cygpath -w "$RUNNER_TEMP")" TEMP="$(cygpath -w "$RUNNER_TEMP")"
          build/tests/tst_bench.exe -o "diag-logs/tst_bench.txt,txt" > diag-logs/tst_bench-console.txt 2>&1 || echo "tst_bench failed"
          grep -h "FAIL!\|No metadata\|Totals" diag-logs/tst_bench*.txt || true
          # A failed run's player log (client side) and the seeders' lines.
          awk '/bench_player (failed|timed out)/{p=1} p' diag-logs/tst_bench-console.txt \
            | grep -iE "bench_player|No metadata|No connections|No peers|connect|disconnect|error|refused|reset|fail|incoming|blocked|listen" | head -400
          echo "== seeder lines with errors or incoming connections"
          grep -E "seeder [0-9]+: \[(peer_disconnected|peer_error|listen_failed|incoming_connection|peer_blocked|peer_connect)" diag-logs/tst_bench.txt | tail -200

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loopback-diagnostic
          path: |
            probe-*.txt
            diag-logs/

  # The rare macOS crash in tst_torrentstream nextFileInTheSameTorrentReportsItsStatus:
  # run it many times, with symbols, and print macOS's crash report.
  macos:
    name: macOS crash hunt
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install qt mpv boost openssl@3 ninja pkgconf

      - uses: ./.github/actions/libtorrent

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$CJ_LT_PREFIX" -DCJ_REQUIRE_PATCHED_LIBTORRENT=ON

      - name: Build
        run: cmake --build build --target tst_torrentstream tst_broker

      - name: Run the crashing test 80 times
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p crash-logs
          fails=0
          for i in $(seq 80); do
            if ! build/tests/tst_torrentstream nextFileInTheSameTorrentReportsItsStatus > "crash-logs/run-$i.txt" 2>&1; then
              fails=$((fails+1)); echo "run $i failed"; tail -5 "crash-logs/run-$i.txt"
            fi
          done
          echo "failed runs: $fails"

      - name: Whole tst_torrentstream 20 times
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          fails=0
          for i in $(seq 20); do
            build/tests/tst_torrentstream > "crash-logs/full-$i.txt" 2>&1 || { fails=$((fails+1)); echo "full run $i failed"; grep -E "FAIL|signal" "crash-logs/full-$i.txt" | head -5; }
          done
          echo "failed full runs: $fails"

      - name: Crash reports
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i tst_ || echo "no crash reports"
          for f in ~/Library/Logs/DiagnosticReports/tst_*; do
            [ -f "$f" ] || continue
            echo "== $f"; cp "$f" crash-logs/
            python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          head, _, body = text.partition('\n')
          d = json.loads(body)
          images = d.get('usedImages', [])
          print('exception:', d.get('exception'), 'faulting thread:', d.get('faultingThread'))
          for ti, t in enumerate(d.get('threads', [])):
              if ti != d.get('faultingThread') and not t.get('triggered'):
                  continue
              print('thread', ti, t.get('name', ''), t.get('queue', ''))
              for fr in t.get('frames', [])[:40]:
                  img = images[fr['imageIndex']]['name'] if fr.get('imageIndex') is not None and fr['imageIndex'] < len(images) else '?'
                  print('  ', img, fr.get('symbol', hex(fr.get('imageOffset', 0))), fr.get('sourceFile', ''), fr.get('sourceLine', ''))
          PY
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-crash-hunt
          path: crash-logs/
